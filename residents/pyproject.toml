[project]
name = "ember-residents"
version = "0.1.0"
description = "Ember backend: shared-state DB, HTTP/WS API, Photon threads, the one LLM extraction call, replan loop"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.15.0",
    "certifi>=2026.7.22",
    "ember-engine",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-socketio[asyncio-client]>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ember-drill = "residents.drill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["residents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
ember-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
