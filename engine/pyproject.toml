[project]
name = "ember-engine"
version = "0.1.0"
description = "Ember simulation engine: OSM world builder, hazards, tick engine, job runner"
requires-python = ">=3.12,<3.14"
dependencies = [
    "osmnx>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "jsonschema>=4.21",   # validate-scenario
    "referencing>=0.35",
    "daytona>=0.200",     # robustness fan-out; a core dependency so the backend (which imports the engine) can use it
]

[project.optional-dependencies]
dev = ["pytest>=8"]
daytona = []   # kept so `ember-engine[daytona]` still resolves; daytona is a core dependency now

[project.scripts]
ember = "ember_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
