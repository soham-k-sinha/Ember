[project]
name = "ember-engine"
version = "0.1.0"
description = "Ember simulation engine: OSM world builder, hazards, tick engine, job runner"
requires-python = ">=3.12,<3.14"
dependencies = [
    "osmnx>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
daytona = ["daytona>=0.200"]

[project.scripts]
ember = "ember_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
